name: CI

# The jobs call ci/gates.sh and do nothing else of substance (plan 50, D6).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Seconds, no dependencies beyond python3. Until now CLAUDE.md's gate
  # checklist was something a human had to remember before every PR; this is the
  # half of it that can be enforced for free, on every push.
  # ---------------------------------------------------------------------------
  static:
    name: Static checkers
    # Pinned, like build-and-test below and for the same reason (QBX-309).
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: ./ci/gates.sh --static

  # ---------------------------------------------------------------------------
  # The full gate: build + the checkers + all 406 qxa/unit cases.
  #
  # Linux, not macOS, for three reasons: the repo's two known standing-failure
  # lists are docs/MACOS_GATE.md (7 failures as of 2026-09-30, QBX-118) and
  # docs/ASIO_WINDOWS_GATE.md, so a macOS job would be red by construction;
  # Linux minutes are 1x where macOS are 10x; and Linux is the one platform with
  # no standing-failure list, which is either because it is clean or because
  # nobody has measured. This job is how that gets measured.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build + ctest (Linux)
    # PINNED, not ubuntu-latest (QBX-309). The image decides the gate: the apt
    # packages below, Qt above all, come from it, and docs/LINUX_GATE.md is a
    # measurement of one image. ubuntu-latest moved from 24.04 to 26.04 between
    # 2026-11-05 and 2026-11-06 and took Qt from 6.4.2 to 6.10.2 with nothing in
    # any diff to say so. 26.04 is what it ran then, so this pin changes nothing.
    # MOVE IT FORWARD DELIBERATELY: a commit of its own that bumps both jobs,
    # with a green run and a re-measured LINUX_GATE.md, so a red run can be
    # bisected to it. A pin nobody moves rots the other way, until the image
    # is retired under it.
    runs-on: ubuntu-26.04
    # A green run takes 14-19 min (15 runs measured 2026-11-06). Without a limit
    # a runner-side stall waits for GitHub's 6 h default: on 2026-11-05 #351's
    # `apt-get update` hung on the Azure mirror and the job sat for 6 h 0 m
    # before turning red, having built nothing. 60 min is three green runs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # smaragd/third_party/{clap,vst3_pluginterfaces}. Without them the
          # build succeeds but SILENTLY DROPS plugin hosting and the plugin_*
          # cases with it (docs/BUILD.md), which would make this job pass while
          # testing less than it claims.
          submodules: recursive

      - name: Install build dependencies
        # Seconds when the mirror answers; a hang here is the runner's, not
        # the change's (re-run the job).
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            qt6-base-dev \
            libgl1-mesa-dev \
            libsndfile1-dev libvorbis-dev libogg-dev \
            libasound2-dev \
            libsecret-1-dev

      - name: Gate
        run: ./ci/gates.sh
        env:
          # No display on a runner, and the qxa cases construct a real
          # QApplication. The offscreen plugin ships with qt6-base.
          QT_QPA_PLATFORM: offscreen
          CTEST_JOBS: "4"

          # Two exclusions, for two different reasons, both with an entry in
          # docs/LINUX_GATE.md:
          #
          #   qxa.asset_clip_preview  SEGFAULTs on Linux, cause not yet known.
          #                           Meant to be temporary. LINUX_GATE.md 2.
          #   secret_store_test       Needs a D-Bus session and a keyring, which
          #                           a GitHub-hosted runner does not have.
          #                           Environmental, like the macOS-only AU
          #                           cases. LINUX_GATE.md 1.
          CTEST_EXCLUDE: '^(qxa\.asset_clip_preview|secret_store_test)$'

      # QBX-322: what ci/gates.sh collected from the FAILED tests -- per test, its
      # run.log and a copy of its --test-output-dir (the playback-capture .wav
      # above all). `if: failure()` keeps a green run from uploading anything;
      # a red run before ctest (build, checkers) has no directory, hence
      # if-no-files-found: ignore. Seven days covers a weekend's triage; the
      # collector caps the copied output at 200 MB for a run where everything
      # fails.
      - name: Upload failed cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-cases-${{ github.run_id }}-${{ github.run_attempt }}
          path: smaragd/build/failed-cases/
          if-no-files-found: ignore
          retention-days: 7
